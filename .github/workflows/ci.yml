name: Mental Pulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Paketi ve geliştirme bağımlılıklarını kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Birim testlerini çalıştır (pytest)
        run: pytest -v

      - name: CLI duman testleri (audit, sample-size, erde, screen, features)
        run: |
          mental-pulse audit
          mental-pulse sample-size --prevalence 0.064 --parameters 15
          mental-pulse erde --y-true 1,1,0,0 --y-pred 1,1,0,0 --delays 3,12,5,5
          mental-pulse screen --scale phq9 --scores 2,2,1,2,1,1,1,0,1
          mental-pulse features "Ben her zaman kendimi yalnız hissediyorum."
          python scripts/train_berturk_template.py --help
